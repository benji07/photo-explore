<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="titre desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="titre">Doser le pré-flash : montage de l'agrandisseur et bande d'essai de seuil</title>
  <desc id="desc">À gauche, l'agrandisseur sert de source de flash : on remplace le négatif par une chute de film C-41 vierge (au masque orangé) en conservant la filtration du tirage, pour un flash neutre et uniforme sur le papier ; la dose se règle par le temps. À droite, une bande d'essai de pré-flash : des crans d'exposition croissante restent blancs jusqu'à un cran où une première teinte apparaît ; on retient le temps du cran juste avant cette teinte, et une zone témoin de papier vierge sert de référence.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#fbfaf8"/>

  <!-- ===== Colonne agrandisseur ===== -->
  <text x="150" y="30" text-anchor="middle" font-size="13" fill="#1c1b1a" font-weight="bold">L'agrandisseur comme source</text>

  <!-- faisceau -->
  <path d="M118 196 H182 L228 348 H72 Z" fill="#f7eccb" opacity="0.6"/>
  <!-- lampe -->
  <rect x="110" y="44" width="80" height="28" rx="5" fill="#fffaf0" stroke="#8a5a3b" stroke-width="1.4"/>
  <text x="150" y="63" text-anchor="middle" font-size="12" fill="#1c1b1a">Lampe</text>
  <!-- tete couleur -->
  <rect x="98" y="78" width="104" height="50" rx="5" fill="#ffffff" stroke="#6b6862" stroke-width="1.4"/>
  <text x="150" y="98" text-anchor="middle" font-size="11" fill="#6b6862">Tête couleur</text>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="#8a5a3b">(neutre ou Y/M)</text>
  <!-- film vierge a la place du negatif -->
  <rect x="112" y="138" width="76" height="22" rx="3" fill="#f0b878" stroke="#a8682a" stroke-width="1.4"/>
  <text x="150" y="153" text-anchor="middle" font-size="9.5" fill="#5a3a1a">film C-41 vierge</text>
  <!-- objectif -->
  <path d="M126 170 H174 L162 196 H138 Z" fill="#2b2a28" stroke="#1c1b1a" stroke-width="1.4"/>
  <!-- papier -->
  <rect x="64" y="348" width="172" height="26" rx="3" fill="#fffdf9" stroke="#8a5a3b" stroke-width="1.4"/>
  <text x="150" y="366" text-anchor="middle" font-size="12" fill="#1c1b1a">Papier sur le margeur</text>

  <!-- annotations -->
  <text x="214" y="92" font-size="11" fill="#8a5a3b">filtration</text>
  <text x="214" y="106" font-size="11" fill="#8a5a3b">du tirage</text>
  <text x="214" y="190" font-size="11" fill="#8a5a3b">dose réglée</text>
  <text x="214" y="204" font-size="11" fill="#8a5a3b">par le temps</text>
  <text x="150" y="392" text-anchor="middle" font-size="10" fill="#6b6862">lumière douce et uniforme, sans détail d'image</text>

  <!-- separateur -->
  <line x1="300" y1="40" x2="300" y2="392" stroke="#e7e3dc" stroke-width="1.4"/>

  <!-- ===== Bande d'essai ===== -->
  <text x="470" y="30" text-anchor="middle" font-size="13" fill="#1c1b1a" font-weight="bold">Bande d'essai : trouver le seuil</text>

  <!-- temoin -->
  <rect x="360" y="58" width="60" height="40" rx="3" fill="#ffffff" stroke="#cfcabf" stroke-width="1.2"/>
  <text x="390" y="116" text-anchor="middle" font-size="10" fill="#6b6862">témoin</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#6b6862">(papier vierge)</text>

  <!-- crans (exposition croissante) -->
  <g stroke="#cfcabf" stroke-width="1">
    <rect x="360" y="170" width="40" height="84" fill="#ffffff"/>
    <rect x="400" y="170" width="40" height="84" fill="#fffffe"/>
    <rect x="440" y="170" width="40" height="84" fill="#fbfaf6"/>
    <rect x="480" y="170" width="40" height="84" fill="#f4efe6"/>
    <rect x="520" y="170" width="40" height="84" fill="#e9e1d3"/>
    <rect x="560" y="170" width="40" height="84" fill="#ddd2c0"/>
  </g>
  <!-- temps -->
  <g font-size="10" fill="#6b6862" text-anchor="middle">
    <text x="380" y="268">4 s</text>
    <text x="420" y="268">6 s</text>
    <text x="460" y="268">8 s</text>
    <text x="500" y="268">10 s</text>
    <text x="540" y="268">12 s</text>
    <text x="580" y="268">14 s</text>
  </g>

  <!-- repere seuil -->
  <line x1="480" y1="158" x2="480" y2="170" stroke="#9c3461" stroke-width="1.4"/>
  <path d="M500 300 L500 282" fill="none" stroke="#9c3461" stroke-width="1.3" marker-end="url(#a3)"/>
  <text x="470" y="318" text-anchor="middle" font-size="11" fill="#9c3461">première teinte visible</text>
  <text x="470" y="332" text-anchor="middle" font-size="11" fill="#9c3461">→ on retient le cran juste avant</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#9c3461"/>
    </marker>
  </defs>
</svg>
