<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="titre desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="titre">Effet du pré-flashage sur la courbe caractéristique du papier RA-4</title>
  <desc id="desc">Deux courbes densité/log-exposition. Sans pré-flash, la courbe reste plate (densité minimale) jusqu'à un seuil d'inertie, puis monte fortement. Avec pré-flash, le pied de la courbe est relevé : aux faibles expositions — qui correspondent aux tons clairs du tirage négatif-positif — une densité apparaît dès le départ et la pente y est plus douce, ce qui réduit le contraste dans les hautes lumières.</desc>
  <rect x="0" y="0" width="560" height="430" fill="#fbfaf8"/>

  <!-- zone tons clairs (faibles expositions) -->
  <rect x="80" y="50" width="150" height="300" fill="#f7eccb" opacity="0.5"/>
  <text x="155" y="372" text-anchor="middle" font-size="11" fill="#8a5a3b">tons clairs du tirage</text>
  <text x="155" y="386" text-anchor="middle" font-size="11" fill="#8a5a3b">(négatif dense)</text>

  <!-- axes -->
  <line x1="80" y1="50" x2="80" y2="350" stroke="#6b6862" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="525" y2="350" stroke="#6b6862" stroke-width="1.5"/>
  <text x="300" y="412" text-anchor="middle" font-size="12" fill="#6b6862">Exposition (échelle log)</text>
  <text x="34" y="200" text-anchor="middle" font-size="12" fill="#6b6862" transform="rotate(-90 34 200)">Densité</text>

  <!-- seuil -->
  <line x1="175" y1="350" x2="175" y2="318" stroke="#9c3461" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="178" y="338" text-anchor="start" font-size="11" fill="#9c3461">seuil (inertie)</text>

  <!-- courbe sans pré-flash -->
  <path d="M80 320 L175 318 C215 314 245 250 280 185 C310 130 345 95 390 80 C440 70 490 67 520 66"
        fill="none" stroke="#1c1b1a" stroke-width="2.4"/>

  <!-- courbe avec pré-flash -->
  <path d="M80 300 C130 296 160 280 200 245 C240 205 280 150 320 120 C360 95 410 72 460 68 C490 66 510 66 520 66"
        fill="none" stroke="#2a4490" stroke-width="2.4" stroke-dasharray="7 5"/>

  <!-- annotation pied relevé -->
  <path d="M150 250 q-25 18 -55 38" fill="none" stroke="#2a4490" stroke-width="1" marker-end="url(#fl)"/>
  <text x="150" y="244" text-anchor="middle" font-size="11" fill="#2a4490">pied relevé</text>

  <!-- legende -->
  <line x1="330" y1="120" x2="366" y2="120" stroke="#1c1b1a" stroke-width="2.4"/>
  <text x="372" y="124" font-size="12" fill="#1c1b1a">sans pré-flash</text>
  <line x1="330" y1="142" x2="366" y2="142" stroke="#2a4490" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="372" y="146" font-size="12" fill="#2a4490">avec pré-flash</text>

  <defs>
    <marker id="fl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#2a4490"/>
    </marker>
  </defs>
</svg>
