<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" role="img" aria-labelledby="titre desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="titre">Corrections de filtration RA-4 selon la dominante</title>
  <desc id="desc">Table de correction en tirage RA-4 : pour chaque dominante perçue sur l'épreuve, l'action à mener sur les molettes jaune (Y) et magenta (M). Jaune : monter Y. Magenta : monter M. Cyan : baisser Y et M. Bleu : baisser Y. Vert : baisser M. Rouge : baisser Y et M.</desc>
  <rect x="0" y="0" width="520" height="392" fill="#fbfaf8"/>
  <!-- en-tetes -->
  <text x="40" y="34" font-size="13" fill="#6b6862" font-weight="bold">Dominante vue sur l'épreuve</text>
  <text x="300" y="34" font-size="13" fill="#6b6862" font-weight="bold">Correction (molettes)</text>
  <line x1="40" y1="46" x2="480" y2="46" stroke="#e7e3dc" stroke-width="1.5"/>

  <!-- Jaune -->
  <rect x="40" y="58" width="46" height="30" rx="4" fill="#f2c84b" stroke="#caa436"/>
  <text x="98" y="78" font-size="13" fill="#1c1b1a">Jaune</text>
  <text x="300" y="78" font-size="13" fill="#1c1b1a">monter <tspan font-weight="bold">Y</tspan></text>

  <!-- Magenta -->
  <rect x="40" y="102" width="46" height="30" rx="4" fill="#c8487f" stroke="#9c3461"/>
  <text x="98" y="122" font-size="13" fill="#1c1b1a">Magenta</text>
  <text x="300" y="122" font-size="13" fill="#1c1b1a">monter <tspan font-weight="bold">M</tspan></text>

  <!-- Cyan -->
  <rect x="40" y="146" width="46" height="30" rx="4" fill="#4fb3b3" stroke="#338f8f"/>
  <text x="98" y="166" font-size="13" fill="#1c1b1a">Cyan</text>
  <text x="300" y="166" font-size="13" fill="#1c1b1a">baisser <tspan font-weight="bold">Y</tspan> et <tspan font-weight="bold">M</tspan></text>

  <line x1="40" y1="190" x2="480" y2="190" stroke="#e7e3dc" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bleu -->
  <rect x="40" y="202" width="46" height="30" rx="4" fill="#3a5bbf" stroke="#2a4490"/>
  <text x="98" y="222" font-size="13" fill="#1c1b1a">Bleu</text>
  <text x="300" y="222" font-size="13" fill="#1c1b1a">baisser <tspan font-weight="bold">Y</tspan></text>

  <!-- Vert -->
  <rect x="40" y="246" width="46" height="30" rx="4" fill="#4a9d5b" stroke="#347043"/>
  <text x="98" y="266" font-size="13" fill="#1c1b1a">Vert</text>
  <text x="300" y="266" font-size="13" fill="#1c1b1a">baisser <tspan font-weight="bold">M</tspan></text>

  <!-- Rouge -->
  <rect x="40" y="290" width="46" height="30" rx="4" fill="#c0392b" stroke="#922a20"/>
  <text x="98" y="310" font-size="13" fill="#1c1b1a">Rouge</text>
  <text x="300" y="310" font-size="13" fill="#1c1b1a">baisser <tspan font-weight="bold">Y</tspan> et <tspan font-weight="bold">M</tspan></text>

  <!-- rappel -->
  <text x="40" y="358" font-size="11" fill="#8a5a3b" font-style="italic">Le cyan reste à 0 : on n'agit jamais sur les trois molettes à la fois.</text>
</svg>
